# Builds the Docker image (amd64) when what goes into it changes, so a broken
# Dockerfile shows up here rather than on the VM. Nothing is pushed: the VM
# builds its own (arm64) image from the same Dockerfile.
name: Image

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - backend/requirements.lock
      - frontend/package.json
      - frontend/package-lock.json
      - deploy/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: packages-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the image starts and answers its health check (no database: /api/health doesn't need one)
      - name: Smoke test
        run: |
          docker run -d --name pt -e DATABASE_URL=sqlite:////tmp/ci.db -e APP_SECRET_KEY=ci-only-not-a-secret packages-tracker:ci
          for i in $(seq 1 30); do
            if docker exec pt python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read().decode())"; then
              docker exec pt python -c "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2); assert b'id=\"root\"' in r.read(), 'the UI is not served'"
              exit 0
            fi
            sleep 2
          done
          docker logs pt
          exit 1
