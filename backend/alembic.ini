# Alembic config for the Packages Tracker database.
# The connection URL is NOT here: env.py reads DATABASE_URL (app/config.py, .env).
#   cd backend && alembic upgrade head          # apply migrations (the app also does this on startup)
#   alembic revision --autogenerate -m "..."    # after changing app/db_models.py

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
