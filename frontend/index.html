<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Packages Tracker</title>
    <!-- the saved theme, before first paint (a file: the CSP allows no inline scripts) -->
    <script src="/theme-init.js"></script>
    <style>
      /* first-paint background; matches PALETTE.page in src/theme.tsx */
      html[data-theme="dark"], html[data-theme="dark"] body { background: #131519; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f5f7; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
