[project]
name = "packages-tracker-backend"
version = "0.1.0"
description = "Packages Tracker: EOL/EOS status of open-source components — FastAPI + AI agents, PostgreSQL storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # FastAPI needs it for the File/Form parameters of the zip-upload routes
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "packaging>=24.0",
    # AI providers with the user's own key (app/ai/)
    "anthropic>=2.0",
    "openai>=1.40",
    # encryption at rest for keys and tokens (app/crypto.py)
    "cryptography>=42",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# AGENT_BACKEND=sdk/auto only (the default, subprocess, runs the `claude`
# binary directly). It bundles the whole Claude Code CLI, which the cloud
# image doesn't need: the public mode can't use the CLI.
claude = ["claude-agent-sdk>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
